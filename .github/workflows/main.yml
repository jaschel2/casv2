name: Build MAT267CAS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install CE toolchain v15.0
      run: |
        wget -q https://github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz
        tar xf CEdev-Linux.tar.gz
        echo "$PWD/CEdev/bin" >> $GITHUB_PATH

    - name: Verify toolchain
      run: cedev-config --version

    - name: Build
      run: make

    - name: Upload 8xp
      uses: actions/upload-artifact@v4
      with:
        name: MAT267CAS
        path: bin/MAT267CAS.8xp
        retention-days: 30
